spring:
  application:
    name: monster-hunter
  devtools:
    add-properties: false   # devtools 本機開發模式預設會強制打開詳細錯誤堆疊，蓋掉下面的 include-stacktrace 設定
  flyway:
    enabled: true
    locations: "classpath:db/migration"
  datasource:
    # 連線資訊全部可用環境變數覆蓋，沒設定時使用冒號後面的預設值。
    # 密碼刻意不給預設值：本機沒設 DB_PASSWORD 就直接啟動失敗，
    # 而不是不小心用一組寫死在檔案裡、還被 commit 上 GitHub 的密碼。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monsterhunter_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # schema 由 Flyway 管理，Hibernate 只驗證，不要改成 update
    show-sql: true

jwt:
  # 密碼刻意不給預設值：本機沒設 JWT_SECRET 就直接啟動失敗，
  # 而不是不小心用一組寫死在檔案裡、還被 commit 上 GitHub 的密鑰簽 token。
  # 長度要符合 HS256 最低 256 bits（32 bytes）要求，本機可以隨便打一串夠長的亂數字串。
  secret: ${JWT_SECRET}
  access-token-expiration: 900000       # 15 分鐘（毫秒）
  refresh-token-expiration: 604800000   # 7 天（毫秒）

server:
  port: ${SERVER_PORT:8080}
  error:
    # 不要把例外類別名稱、堆疊資訊回給呼叫端；devtools 在本機開發模式預設會打開這個，容易忘記關掉。
    include-stacktrace: never
    include-message: always
    include-binding-errors: always   # @Valid 驗證失敗時，要看得到是哪個欄位、為什麼不合法
